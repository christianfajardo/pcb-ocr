[project]
name = "pcb-ocr"
version = "0.1.0"
description = "Multi-model OCR pipeline for PCB fabrication drawings"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "langgraph>=0.2",
    "pdf2image>=1.17",
    "opencv-python>=4.9",
    "pillow>=10.0",
    "structlog>=24.1",
    "python-multipart>=0.0.9",
    "openai>=1.30",
    "pymupdf>=1.24",
    "redis>=5.0",
]

[project.optional-dependencies]
tesseract = [
    "pytesseract>=0.3.10",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
timeout = 1100
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100